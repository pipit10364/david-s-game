<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matcha Cooking Quiz</title>
  <style>
    :root{--green:#7ab84d;--ink:#203020}
    body{font-family:Arial,sans-serif;background:#efe8db;margin:0;padding:16px;color:#222}
    .wrap{max-width:1020px;margin:auto;background:#fff;border-radius:14px;padding:16px}
    h2{margin-top:0}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .col{background:#faf9f5;border:1px solid #e9e4d8;border-radius:10px;padding:10px}
    .item,.slot{padding:11px 12px;border-radius:10px;border:2px solid #ddd;margin-bottom:8px;background:#fff;cursor:pointer;font-weight:700}
    .item.selected{border-color:var(--green)} .item.used{opacity:.35;pointer-events:none}
    .slot{min-height:44px;background:#eef7df;border-style:dashed}
    .slot.filled{border-style:solid;background:#dff0c2}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button,a.btn{padding:10px 14px;border:none;border-radius:10px;background:var(--green);color:white;cursor:pointer;text-decoration:none}
    .chem{margin-top:14px;padding:12px;border-radius:10px;background:#f0f4ff;line-height:1.5}
    @media(max-width:800px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍵 Matcha Cooking Quiz</h2>
    <p>Pilih step di kiri, lalu klik slot urutan di kanan. Kamu punya <b>3 nyawa</b>.</p>
    <div style="font-weight:700">Nyawa: <span id="lives">❤️❤️❤️</span></div>
    <div class="layout">
      <div class="col"><h4>Pilihan Step</h4><div id="steps"></div></div>
      <div class="col"><h4>Urutan Masak</h4><div id="slots"></div></div>
    </div>
    <div class="row">
      <button onclick="checkOrder()">Cek Jawaban</button>
      <button onclick="resetSlotsOnly()">Ulang Isi Slot</button>
      <a class="btn" href="matcha-serving.html">Lanjut ke Serving</a>
      <a class="btn" href="index.html">Kembali</a>
    </div>
    <div id="result" class="chem">Petunjuk: urutan benar akan menampilkan penjelasan kimia.</div>
  </div>
<script>
const correct=['Panaskan air','Ayak matcha','Saring matcha','Masukkan susu dingin','Masukkan es batu'];
const chem={'Panaskan air':'Suhu hangat membantu senyawa matcha larut merata.','Ayak matcha':'Mengurangi gumpalan agar tekstur halus.','Saring matcha':'Memisahkan partikel besar supaya smooth.','Masukkan susu dingin':'Protein susu memberi body creamy.','Masukkan es batu':'Pendinginan cepat bikin rasa segar dan ringan.'};
let chosen=null, filled=Array(correct.length).fill(''), lives=3, shuffledSteps=[];

function initRound(){shuffledSteps=[...correct].sort(()=>Math.random()-0.5);}
function render(){
  steps.innerHTML=''; slots.innerHTML='';
  shuffledSteps.forEach(step=>{
    const el=document.createElement('div'); el.className='item'+(filled.includes(step)?' used':'');
    if(chosen===step) el.classList.add('selected'); el.textContent=step;
    el.onclick=()=>{chosen=step;render();}; steps.appendChild(el);
  });
  filled.forEach((v,i)=>{const el=document.createElement('div'); el.className='slot'+(v?' filled':''); el.textContent=v||`Slot ${i+1}`; el.onclick=()=>{if(!chosen) return; filled[i]=chosen; chosen=null; render();}; slots.appendChild(el);});
  livesSpan.textContent=Array.from({length:3},(_,i)=>i<lives?'❤️':'🖤').join('');
}
function checkOrder(){
  if(filled.includes('')) return result.innerHTML='<b>⚠️ Slot belum lengkap.</b>';
  const ok=filled.every((v,i)=>v===correct[i]);
  if(ok){
    localStorage.setItem('matchaCookingPass','1');
    result.innerHTML='<b>✅ Benar!</b><br>'+correct.map((s,n)=>`${n+1}. ${s} — ${chem[s]}`).join('<br>');
  } else {
    lives--;
    if(lives<=0){
      result.innerHTML='<b>❌ Nyawa habis.</b> Urutan diacak ulang dari awal.';
      lives=3;
      filled=Array(correct.length).fill('');
      initRound();
    } else {
      result.innerHTML=`<b>❌ Urutan belum tepat.</b> Sisa nyawa: ${lives}`;
      filled=Array(correct.length).fill('');
    }
    chosen=null; render();
  }
}
function resetSlotsOnly(){filled=Array(correct.length).fill(''); chosen=null; result.textContent='Silakan susun ulang urutan step.'; render();}
const steps=document.getElementById('steps'),slots=document.getElementById('slots'),result=document.getElementById('result'),livesSpan=document.getElementById('lives');
initRound(); render();
</script>
</body>
</html>
