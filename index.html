<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chem Crush ⚗️</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
:root{
  --sky:#ddf0fa;--sky2:#c4e5f5;--sky3:#a8d8ef;
  --panel:#fff;--panel2:#f0f8fd;--border:#c0dff0;
  --ink:#1a3a50;--ink2:#3a6a88;--muted:#7aaabf;
  --gold:#d48a08;--gold-light:#fff3d0;
  --green:#40b060;--red:#d04040;
  --radius:14px;--shadow:0 2px 12px rgba(80,160,210,0.13);
}
html,body{width:100%;min-height:100vh;background:var(--sky);font-family:'Nunito',sans-serif;color:var(--ink);overflow-x:hidden}

.screen{display:none;flex-direction:column;align-items:center;min-height:100vh}
.screen.on{display:flex}

/* ══ MAP ══ */
#s-map{padding:16px 12px 24px;gap:12px;background:linear-gradient(160deg,#d0ecf8,#e8f6fc)}
.map-header{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.map-title{font-family:'Fredoka One',cursive;font-size:30px;color:var(--ink)}
.map-byline{font-size:12px;color:var(--ink2);line-height:1.5;max-width:300px}
.map-badge{background:var(--panel);border:1.5px solid var(--border);border-radius:999px;padding:4px 14px;font-size:11px;font-weight:800;color:var(--ink2)}

.legend-wrap{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:8px 10px;width:100%;max-width:360px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink2);font-weight:800}
.leg-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}

.lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px}
.lvl-node{display:flex;flex-direction:column;align-items:center;gap:3px}
.lvl-bubble{
  width:60px;height:60px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:14px;
  border:2px solid var(--border);background:var(--panel2);color:var(--muted);
  line-height:1.2;transition:transform .12s;cursor:default;
}
.lvl-bubble.unlocked,.lvl-bubble.current,.lvl-bubble.done{cursor:pointer}
.lvl-bubble:active{transform:scale(0.91)}
.lvl-bubble.unlocked{background:#e6f8ec;border-color:#70c880;color:#1a6030}
.lvl-bubble.current{background:#e4eeff;border-color:#6090e0;color:#1a3888;animation:boblv 2s ease-in-out infinite}
.lvl-bubble.done{background:#e4f2fc;border-color:#60aad0;color:#1a4870}
.lvl-stars{font-size:10px;letter-spacing:1px;color:var(--gold)}
.lv-name{font-size:9px;color:var(--muted);text-align:center;max-width:68px;line-height:1.3;font-weight:800}
@keyframes boblv{0%,100%{box-shadow:0 0 0 0 rgba(96,144,224,0.35)}50%{box-shadow:0 0 0 8px rgba(96,144,224,0)}}

/* ══ GAME ══ */
#s-game{background:var(--sky);padding:0;position:relative}

.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;width:100%;background:var(--panel);border-bottom:1.5px solid var(--border);box-shadow:0 2px 8px rgba(80,160,210,0.08)}
.hud-block{display:flex;flex-direction:column;align-items:center;gap:1px}
.hud-val{font-family:'Fredoka One',cursive;font-size:24px;color:var(--ink);line-height:1}
.hud-lbl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
.hud-lv{font-size:11px;color:var(--ink2);font-weight:800;text-align:center;max-width:140px;line-height:1.3}

.target-bar{display:flex;gap:6px;padding:6px 12px;width:100%;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--border)}
.target-pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1.5px solid var(--border);border-radius:999px;padding:4px 12px;font-size:11px;white-space:nowrap;font-weight:800;color:var(--ink2)}
.target-pill.done{opacity:0.4;text-decoration:line-through}
.target-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.prog-wrap{width:100%;height:6px;background:var(--sky2)}
.prog-fill{height:100%;background:linear-gradient(90deg,#50c880,#a0e840);transition:width .4s ease}

.board-area{display:flex;align-items:center;justify-content:center;padding:12px 8px;flex:1;position:relative}
.board{display:grid;gap:4px;padding:10px;background:var(--panel);border-radius:18px;border:1.5px solid var(--border);box-shadow:var(--shadow)}

/* ── TILES ── */
.cell{
  border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  border:2px solid transparent;
  transition:transform .1s;
  box-shadow:0 2px 5px rgba(0,0,0,0.07);
}
.cell:active{transform:scale(0.9)}
.cell.selected{transform:scale(1.1);z-index:2;outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 4px 14px rgba(212,138,8,0.3)}
.cell.hint-glow{animation:hintpls .85s ease infinite}
.cell.obstacle{cursor:default;background:#ece4d8;border-color:#c8b898;box-shadow:none}
.cell.inert-cell{background:var(--sky2);border-color:var(--border);box-shadow:none;cursor:default}
@keyframes hintpls{0%,100%{box-shadow:0 0 0 0 rgba(212,138,8,0.5)}50%{box-shadow:0 0 0 6px rgba(212,138,8,0)}}

.cell[data-elem="H"]{background:#ddeeff;border-color:#88bbee}
.cell[data-elem="H"] .cs{color:#1a5898}.cell[data-elem="H"] .cn{color:#4488cc}
.cell[data-elem="O"]{background:#fde8e8;border-color:#f09090}
.cell[data-elem="O"] .cs{color:#c02020}.cell[data-elem="O"] .cn{color:#d05050}
.cell[data-elem="Na"]{background:#fdf6d8;border-color:#e8c840}
.cell[data-elem="Na"] .cs{color:#8a6200}.cell[data-elem="Na"] .cn{color:#aa8020}
.cell[data-elem="Cl"]{background:#e2f8e2;border-color:#70cc70}
.cell[data-elem="Cl"] .cs{color:#1a6a1a}.cell[data-elem="Cl"] .cn{color:#3a8a3a}
.cell[data-elem="C"]{background:#ececec;border-color:#aaaaaa}
.cell[data-elem="C"] .cs{color:#333333}.cell[data-elem="C"] .cn{color:#666666}
.cell[data-elem="N"]{background:#ece8ff;border-color:#aa88ee}
.cell[data-elem="N"] .cs{color:#4a1a9a}.cell[data-elem="N"] .cn{color:#7040ba}
.cell[data-elem="Ca"]{background:#fff0e0;border-color:#f0a850}
.cell[data-elem="Ca"] .cs{color:#8a4000}.cell[data-elem="Ca"] .cn{color:#aa6020}
.cell[data-elem="Fe"]{background:#fde8d8;border-color:#d08050}
.cell[data-elem="Fe"] .cs{color:#7a2000}.cell[data-elem="Fe"] .cn{color:#9a4020}
.cell[data-elem="S"]{background:#fffbd0;border-color:#d8c020}
.cell[data-elem="S"] .cs{color:#6a5000}.cell[data-elem="S"] .cn{color:#8a7010}
.cell[data-elem="K"]{background:#e8e8ff;border-color:#9090e0}
.cell[data-elem="K"] .cs{color:#1a1a88}.cell[data-elem="K"] .cn{color:#4040aa}

.cs{font-size:16px;font-weight:900;line-height:1}
.cn{font-size:8px;font-weight:800;line-height:1;margin-top:1px;opacity:0.8}

/* ── BOTTOM BAR ── */
.bottom-bar{display:flex;gap:6px;padding:8px 12px;width:100%;background:var(--panel);border-top:1.5px solid var(--border);justify-content:center;flex-wrap:wrap}
.btn-sm{background:var(--panel2);border:1.5px solid var(--border);border-radius:10px;padding:7px 13px;font-size:11px;font-weight:800;cursor:pointer;color:var(--ink2);font-family:'Nunito',sans-serif;transition:transform .1s,background .1s}
.btn-sm:hover{background:var(--sky2)}
.btn-sm:active{transform:scale(0.93)}
.btn-back{color:var(--muted)}

/* ── FACT CARD ── */
.fact-zone{position:fixed;bottom:72px;left:8px;right:8px;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.fact-card{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;animation:slideUp .3s ease;box-shadow:0 4px 20px rgba(80,160,210,0.18);width:100%;max-width:420px}
.fact-reaction{font-size:15px;font-weight:900;color:var(--gold)}
.fact-title{font-size:11px;font-weight:800;color:var(--ink2)}
.fact-body{font-size:10.5px;color:var(--ink2);line-height:1.6;opacity:0.85}
.fact-noreact{border-color:#f0a0a0;background:#fff5f5}
.fact-noreact .fact-reaction{color:#c04040}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── FLOAT TEXT ── */
.float-txt{position:absolute;font-size:17px;font-weight:900;pointer-events:none;animation:floatUp .9s ease forwards;color:var(--gold);font-family:'Nunito',sans-serif;z-index:60;text-shadow:0 1px 4px rgba(0,0,0,0.12)}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-48px);opacity:0}}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(180,220,240,0.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1.5px solid var(--border);border-radius:24px;padding:26px 22px;text-align:center;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 48px rgba(80,150,200,0.22)}
.modal-icon{font-size:56px}
.modal-stars{font-size:36px;letter-spacing:6px;color:var(--gold)}
.modal-title{font-family:'Fredoka One',cursive;font-size:26px;color:var(--ink)}
.modal-score{font-family:'Fredoka One',cursive;font-size:20px;color:var(--gold)}
.modal-sub{font-size:12px;color:var(--ink2);line-height:1.6}
.modal-fact{background:var(--sky);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--ink2);line-height:1.55;text-align:left;font-weight:700}
.btn-modal{border:none;border-radius:50px;padding:13px 0;font-family:'Fredoka One',cursive;font-size:18px;cursor:pointer;width:100%;transition:transform .12s}
.btn-modal:active{transform:scale(0.96)}
.btn-p{background:linear-gradient(135deg,#40b060,#60d080);color:#fff}
.btn-s{background:var(--sky2);color:var(--ink);border:1.5px solid var(--border)}
</style>
</head>
<body>

<!-- MAP -->
<div id="s-map" class="screen on">
  <div class="map-header">
    <div class="map-title">⚗️ Chem Crush</div>
    <div class="map-byline">Swap elemen yang bisa <strong>bereaksi satu sama lain</strong> — bukan yang warnanya sama!</div>
    <div class="map-badge">14 reaksi kimia nyata · 8 level</div>
  </div>
  <div class="legend-wrap">
    <div class="leg-item"><div class="leg-dot" style="background:#88bbee;border:1.5px solid #88bbee"></div>H</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f09090"></div>O</div>
    <div class="leg-item"><div class="leg-dot" style="background:#aaaaaa"></div>C</div>
    <div class="leg-item"><div class="leg-dot" style="background:#70cc70"></div>Cl</div>
    <div class="leg-item"><div class="leg-dot" style="background:#e8c840"></div>Na</div>
    <div class="leg-item"><div class="leg-dot" style="background:#aa88ee"></div>N</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f0a850"></div>Ca</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d08050"></div>Fe</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d8c020"></div>S</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9090e0"></div>K</div>
  </div>
  <div class="lvl-grid" id="map-grid"></div>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="hud">
    <div class="hud-block">
      <div class="hud-val" id="h-moves">20</div>
      <div class="hud-lbl">Moves</div>
    </div>
    <div class="hud-block">
      <div class="hud-lv" id="h-lv">Level 1</div>
      <div class="hud-val" id="h-score">0</div>
      <div class="hud-lbl">Skor</div>
    </div>
    <div class="hud-block">
      <div class="hud-val" id="h-rx">0</div>
      <div class="hud-lbl">Reaksi</div>
    </div>
  </div>
  <div class="target-bar" id="target-bar"></div>
  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="board-area" id="board-area"><div class="board" id="board"></div></div>
  <div class="fact-zone" id="fact-zone"></div>
  <div class="bottom-bar">
    <button class="btn-sm" onclick="G.boost('hint')">💡 Hint</button>
    <button class="btn-sm" onclick="G.boost('shuffle')">🔀 Shuffle</button>
    <button class="btn-sm" onclick="G.boost('catalyst')">⚡ Catalyst</button>
    <button class="btn-sm btn-back" onclick="G.toMap()">← Map</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-wrap">
  <div class="modal">
    <div class="modal-icon" id="m-icon">🎉</div>
    <div class="modal-stars" id="m-stars"></div>
    <div class="modal-title" id="m-title">Sintesis Berhasil!</div>
    <div class="modal-score" id="m-score"></div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="modal-fact" id="m-fact"></div>
    <button class="btn-modal btn-p" id="m-btn1" onclick="G.mb1()">Lanjut</button>
    <button class="btn-modal btn-s" id="m-btn2" onclick="G.mb2()">Ulang</button>
  </div>
</div>

<script>
const ELEMENTS={
  H:{sym:'H',name:'Hidrogen'},O:{sym:'O',name:'Oksigen'},
  Na:{sym:'Na',name:'Natrium'},Cl:{sym:'Cl',name:'Klorin'},
  C:{sym:'C',name:'Karbon'},N:{sym:'N',name:'Nitrogen'},
  Ca:{sym:'Ca',name:'Kalsium'},Fe:{sym:'Fe',name:'Besi'},
  S:{sym:'S',name:'Sulfur'},K:{sym:'K',name:'Kalium'},
};

const REACTIONS=[
  {elems:['H','O'],product:'H₂O',pts:150,name:'Air',fact:'H₂O terbentuk dari 2 atom hidrogen + 1 oksigen. Ikatan kovalen polar-nya bikin air bisa melarutkan hampir segalanya — itulah kenapa air disebut "universal solvent".'},
  {elems:['Na','Cl'],product:'NaCl',pts:180,name:'Garam dapur',fact:'NaCl terbentuk dari reaksi hebat antara logam Na yang meledak di air dan gas Cl₂ yang beracun. Hasilnya: kristal yang aman dimakan dan bikin masakan enak!'},
  {elems:['C','O'],product:'CO₂',pts:160,name:'Karbon dioksida',fact:'CO₂ dihasilkan dari pembakaran karbon dengan oksigen — juga produk respirasi selular. Tiap napas yang kamu keluarkan mengandung CO₂ hasil metabolisme tubuhmu.'},
  {elems:['N','H'],product:'NH₃',pts:200,name:'Amonia',fact:'NH₃ penting dalam biosintesis protein. Proses Haber-Bosch yang mensintesisnya dari N₂+H₂ adalah penemuan kimia terpenting abad 20 — memungkinkan pupuk untuk miliaran orang.'},
  {elems:['Ca','O'],product:'CaO',pts:170,name:'Kapur bakar',fact:'CaO dari pemanasan batu kapur. Dicampur air jadi Ca(OH)₂ — bahan semen yang membangun peradaban manusia ribuan tahun.'},
  {elems:['Fe','O'],product:'Fe₂O₃',pts:160,name:'Karat besi',fact:'Fe₂O₃ adalah karat besi, hasil oksidasi lambat. Di Mars, Fe₂O₃ yang melimpah bikin planet itu berwarna merah — Mars sejatinya adalah planet yang sedang berkarat!'},
  {elems:['S','O'],product:'SO₂',pts:175,name:'Sulfur dioksida',fact:'SO₂ dari pembakaran bahan bakar fosil. Di atmosfer bereaksi jadi H₂SO₄ — hujan asam yang merusak hutan, danau, dan bangunan bersejarah.'},
  {elems:['K','O'],product:'K₂O',pts:165,name:'Kalium oksida',fact:'Kalium sangat reaktif — bisa terbakar spontan di udara dan meledak jika kena air. Itulah kenapa logam alkali disimpan dalam minyak mineral.'},
  {elems:['Na','O'],product:'Na₂O',pts:170,name:'Natrium oksida',fact:'Na₂O kena air langsung jadi NaOH (soda api) yang sangat korosif. Dipakai untuk membuat sabun, kertas, dan memurnikan aluminium.'},
  {elems:['C','N'],product:'CN⁻',pts:220,name:'Sianida',fact:'Ion CN⁻ sangat beracun — blokir sitokrom c oksidase, enzim vital respirasi sel. Ironisnya, dipakai industri perhiasan untuk memurnikan emas.'},
  {elems:['H','N'],product:'HNO₃',pts:210,name:'Asam nitrat',fact:'HNO₃ digunakan dalam pembuatan pupuk dan bahan peledak. Di tubuh, nitrogen dari protein dipecah jadi NH₃ lalu diubah hati menjadi urea untuk dibuang.'},
  {elems:['Ca','Cl'],product:'CaCl₂',pts:185,name:'Kalsium klorida',fact:'CaCl₂ sangat higroskopis — menyerap uap air dari udara. Di sel tubuh, Ca²⁺ adalah sinyal penting untuk kontraksi otot dan transmisi sinyal saraf.'},
  {elems:['Fe','S'],product:'FeS',pts:175,name:'Besi sulfida',fact:'FeS terbentuk dari reaksi langsung besi dan sulfur saat dipanaskan. Mineral ini banyak ditemukan di kerak bumi dan diyakini ada di inti bumi!'},
  {elems:['K','Cl'],product:'KCl',pts:180,name:'Kalium klorida',fact:'KCl digunakan sebagai pengganti garam bagi penderita hipertensi. Ion K⁺ sangat vital mengatur ritme detak jantung dan fungsi otot.'},
];

const RXMAP={};
REACTIONS.forEach(rx=>{RXMAP[rx.elems.slice().sort().join('|')]=rx;});
function getRx(a,b){return RXMAP[[a,b].sort().join('|')]||null;}

const LEVELS=[
  {id:1,name:'H₂O & NaCl',moves:28,elems:['H','O','Na','Cl'],cols:6,rows:6,target:{reactions:5},obstacles:[]},
  {id:2,name:'Karbon Masuk',moves:28,elems:['H','O','C','N'],cols:6,rows:6,target:{reactions:6,score:900},obstacles:[]},
  {id:3,name:'Lab Berbatu',moves:28,elems:['H','O','Na','Cl','C'],cols:6,rows:7,target:{reactions:7},obstacles:[[2,2],[3,4]]},
  {id:4,name:'Logam Alkali',moves:30,elems:['Na','Cl','Ca','K'],cols:7,rows:6,target:{reactions:8,score:1400},obstacles:[]},
  {id:5,name:'Reaksi Besi',moves:28,elems:['Fe','O','S','C','N'],cols:7,rows:7,target:{reactions:9},obstacles:[[0,3],[6,3]]},
  {id:6,name:'Full Periodik',moves:30,elems:['H','O','Na','Cl','C','N','Ca','Fe'],cols:7,rows:7,target:{reactions:10,score:2000},obstacles:[[2,2],[4,4],[2,4]]},
  {id:7,name:'Chaos Lab',moves:28,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:7,rows:7,target:{reactions:12,score:2500},obstacles:[[3,0],[3,6],[0,3],[6,3]]},
  {id:8,name:'Grand Synthesis',moves:32,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:8,rows:8,target:{reactions:15,score:3500},obstacles:[[0,0],[7,0],[0,7],[7,7],[3,3],[4,4]]},
];

const SAVE='chemcrush_v2';
const G={
  lv:null,board:[],sel:null,score:0,moves:0,reactions:0,busy:false,
  stars:{},scores:{},isWin:false,

  save(){try{localStorage.setItem(SAVE,JSON.stringify({stars:this.stars,scores:this.scores}));}catch(e){}},
  load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');this.stars=d.stars||{};this.scores=d.scores||{};}catch(e){}},

  toMap(){
    document.getElementById('s-game').classList.remove('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('s-map').classList.add('on');
    this.buildMap();
  },

  buildMap(){
    const g=document.getElementById('map-grid');g.innerHTML='';
    const maxU=Math.max(1,...Object.keys(this.stars).map(Number).filter(k=>this.stars[k]>0).map(k=>k+1));
    LEVELS.forEach(lv=>{
      const done=(this.stars[lv.id]||0)>0;
      const unlocked=lv.id<=maxU;
      const cur=lv.id===maxU&&!done;
      const cls=done?'done':cur?'current':unlocked?'unlocked':'';
      const starsStr=done?'★'.repeat(this.stars[lv.id])+'☆'.repeat(3-this.stars[lv.id]):'';
      const nd=document.createElement('div');nd.className='lvl-node';
      nd.innerHTML=`<div class="lvl-bubble ${cls}" onclick="${unlocked?'G.play('+lv.id+')':''}"><span>${lv.id}</span><span style="font-size:9px;opacity:0.7">${lv.elems.slice(0,2).join('·')}</span></div><div class="lvl-stars">${starsStr}</div><div class="lv-name">${lv.name}</div>`;
      g.appendChild(nd);
    });
  },

  play(id){
    const lv=LEVELS.find(l=>l.id===id);if(!lv)return;
    this.lv=lv;this.score=0;this.moves=lv.moves;this.reactions=0;this.sel=null;this.busy=false;
    this.initBoard();this.renderBoard();this.updateHUD();this.buildTargetBar();
    document.getElementById('s-map').classList.remove('on');
    document.getElementById('s-game').classList.add('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('fact-zone').innerHTML='';

/* ══ GAME ══ */

.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;width:100%;background:var(--panel);border-bottom:1.5px solid var(--border);box-shadow:0 2px 8px rgba(80,160,210,0.08)}

.hud-lv{font-size:11px;color:var(--ink2);font-weight:800;text-align:center;max-width:140px;line-height:1.3}

.target-bar{display:flex;gap:6px;padding:6px 12px;width:100%;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--border)}

.prog-wrap{width:100%;height:6px;background:var(--sky2)}

.board-area{display:flex;align-items:center;justify-content:center;padding:12px 8px;flex:1;position:relative}

/* ── TILES ── */
.cell{
  border-radius:11px;

.cell:active{transform:scale(0.9)}

.cell.hint-glow{animation:hintpls .85s ease infinite}

.cell[data-elem="H"]{background:#ddeeff;border-color:#88bbee}

.cell[data-elem="O"]{background:#fde8e8;border-color:#f09090}

.cell[data-elem="Na"]{background:#fdf6d8;border-color:#e8c840}

.cell[data-elem="Cl"]{background:#e2f8e2;border-color:#70cc70}
.cell[data-elem="Cl"] .cs{color:#1a6a1a}.cell[data-elem="Cl"] .cn{color:#3a8a3a}
.cell[data-elem="C"]{background:#ececec;border-color:#aaaaaa}
.cell[data-elem="C"] .cs{color:#333333}.cell[data-elem="C"] .cn{color:#666666}
.cell[data-elem="N"]{background:#ece8ff;border-color:#aa88ee}
.cell[data-elem="N"] .cs{color:#4a1a9a}.cell[data-elem="N"] .cn{color:#7040ba}
.cell[data-elem="Ca"]{background:#fff0e0;border-color:#f0a850}
.cell[data-elem="Ca"] .cs{color:#8a4000}.cell[data-elem="Ca"] .cn{color:#aa6020}
.cell[data-elem="Fe"]{background:#fde8d8;border-color:#d08050}

.cs{font-size:16px;font-weight:900;line-height:1}

/* ── BOTTOM BAR ── */
.bottom-bar{display:flex;gap:6px;padding:8px 12px;width:100%;background:var(--panel);border-top:1.5px solid var(--border);justify-content:center;flex-wrap:wrap}
.btn-sm{background:var(--panel2);border:1.5px solid var(--border);border-radius:10px;padding:7px 13px;font-size:11px;font-weight:800;cursor:pointer;color:var(--ink2);font-family:'Nunito',sans-serif;transition:transform .1s,background .1s}
.btn-sm:hover{background:var(--sky2)}

/* ── FACT CARD ── */
.fact-zone{position:fixed;bottom:72px;left:8px;right:8px;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center}

.fact-reaction{font-size:15px;font-weight:900;color:var(--gold)}

/* ── FLOAT TEXT ── */
.float-txt{position:absolute;font-size:17px;font-weight:900;pointer-events:none;animation:floatUp .9s ease forwards;color:var(--gold);font-family:'Nunito',sans-serif;z-index:60;text-shadow:0 1px 4px rgba(0,0,0,0.12)}

.modal-bg{position:fixed;inset:0;background:rgba(180,220,240,0.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}

.btn-s{background:var(--sky2);color:var(--ink);border:1.5px solid var(--border)}
</style>

<body>

<!-- MAP -->
<div id="s-map" class="screen on">
  <div class="map-header">
    <div class="map-title">⚗️ Chem Crush</div>
    <div class="map-byline">Swap elemen yang bisa <strong>bereaksi satu sama lain</strong> — bukan yang warnanya sama!</div>

    <div class="leg-item"><div class="leg-dot" style="background:#88bbee;border:1.5px solid #88bbee"></div>H</div>

    <div class="leg-item"><div class="leg-dot" style="background:#aa88ee"></div>N</div>

  </div>

</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="hud">
    <div class="hud-block">
      <div class="hud-val" id="h-moves">20</div>
      <div class="hud-lbl">Moves</div>
    </div>

      <div class="hud-val" id="h-score">0</div>

    </div>

    </div>
  </div>
  <div class="target-bar" id="target-bar"></div>
  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>

</div>

    <div class="modal-icon" id="m-icon">🎉</div>

    <button class="btn-modal btn-p" id="m-btn1" onclick="G.mb1()">Lanjut</button>
    <button class="btn-modal btn-s" id="m-btn2" onclick="G.mb2()">Ulang</button>
  </div>

<script>
const ELEMENTS={
  H:{sym:'H',name:'Hidrogen'},O:{sym:'O',name:'Oksigen'},
  Na:{sym:'Na',name:'Natrium'},Cl:{sym:'Cl',name:'Klorin'},
  C:{sym:'C',name:'Karbon'},N:{sym:'N',name:'Nitrogen'},
  Ca:{sym:'Ca',name:'Kalsium'},Fe:{sym:'Fe',name:'Besi'},
  S:{sym:'S',name:'Sulfur'},K:{sym:'K',name:'Kalium'},
};

const REACTIONS=[
  {elems:['H','O'],product:'H₂O',pts:150,name:'Air',fact:'H₂O terbentuk dari 2 atom hidrogen + 1 oksigen. Ikatan kovalen polar-nya bikin air bisa melarutkan hampir segalanya — itulah kenapa air disebut "universal solvent".'},
  {elems:['Na','Cl'],product:'NaCl',pts:180,name:'Garam dapur',fact:'NaCl terbentuk dari reaksi hebat antara logam Na yang meledak di air dan gas Cl₂ yang beracun. Hasilnya: kristal yang aman dimakan dan bikin masakan enak!'},
  {elems:['C','O'],product:'CO₂',pts:160,name:'Karbon dioksida',fact:'CO₂ dihasilkan dari pembakaran karbon dengan oksigen — juga produk respirasi selular. Tiap napas yang kamu keluarkan mengandung CO₂ hasil metabolisme tubuhmu.'},
  {elems:['N','H'],product:'NH₃',pts:200,name:'Amonia',fact:'NH₃ penting dalam biosintesis protein. Proses Haber-Bosch yang mensintesisnya dari N₂+H₂ adalah penemuan kimia terpenting abad 20 — memungkinkan pupuk untuk miliaran orang.'},
  {elems:['Ca','O'],product:'CaO',pts:170,name:'Kapur bakar',fact:'CaO dari pemanasan batu kapur. Dicampur air jadi Ca(OH)₂ — bahan semen yang membangun peradaban manusia ribuan tahun.'},
  {elems:['Fe','O'],product:'Fe₂O₃',pts:160,name:'Karat besi',fact:'Fe₂O₃ adalah karat besi, hasil oksidasi lambat. Di Mars, Fe₂O₃ yang melimpah bikin planet itu berwarna merah — Mars sejatinya adalah planet yang sedang berkarat!'},
  {elems:['S','O'],product:'SO₂',pts:175,name:'Sulfur dioksida',fact:'SO₂ dari pembakaran bahan bakar fosil. Di atmosfer bereaksi jadi H₂SO₄ — hujan asam yang merusak hutan, danau, dan bangunan bersejarah.'},
  {elems:['K','O'],product:'K₂O',pts:165,name:'Kalium oksida',fact:'Kalium sangat reaktif — bisa terbakar spontan di udara dan meledak jika kena air. Itulah kenapa logam alkali disimpan dalam minyak mineral.'},
  {elems:['Na','O'],product:'Na₂O',pts:170,name:'Natrium oksida',fact:'Na₂O kena air langsung jadi NaOH (soda api) yang sangat korosif. Dipakai untuk membuat sabun, kertas, dan memurnikan aluminium.'},
  {elems:['C','N'],product:'CN⁻',pts:220,name:'Sianida',fact:'Ion CN⁻ sangat beracun — blokir sitokrom c oksidase, enzim vital respirasi sel. Ironisnya, dipakai industri perhiasan untuk memurnikan emas.'},
  {elems:['H','N'],product:'HNO₃',pts:210,name:'Asam nitrat',fact:'HNO₃ digunakan dalam pembuatan pupuk dan bahan peledak. Di tubuh, nitrogen dari protein dipecah jadi NH₃ lalu diubah hati menjadi urea untuk dibuang.'},
  {elems:['Ca','Cl'],product:'CaCl₂',pts:185,name:'Kalsium klorida',fact:'CaCl₂ sangat higroskopis — menyerap uap air dari udara. Di sel tubuh, Ca²⁺ adalah sinyal penting untuk kontraksi otot dan transmisi sinyal saraf.'},
  {elems:['Fe','S'],product:'FeS',pts:175,name:'Besi sulfida',fact:'FeS terbentuk dari reaksi langsung besi dan sulfur saat dipanaskan. Mineral ini banyak ditemukan di kerak bumi dan diyakini ada di inti bumi!'},
  {elems:['K','Cl'],product:'KCl',pts:180,name:'Kalium klorida',fact:'KCl digunakan sebagai pengganti garam bagi penderita hipertensi. Ion K⁺ sangat vital mengatur ritme detak jantung dan fungsi otot.'},
];

const RXMAP={};
REACTIONS.forEach(rx=>{RXMAP[rx.elems.slice().sort().join('|')]=rx;});
function getRx(a,b){return RXMAP[[a,b].sort().join('|')]||null;}

const LEVELS=[
  {id:1,name:'H₂O & NaCl',moves:28,elems:['H','O','Na','Cl'],cols:6,rows:6,target:{reactions:5},obstacles:[]},
  {id:2,name:'Karbon Masuk',moves:28,elems:['H','O','C','N'],cols:6,rows:6,target:{reactions:6,score:900},obstacles:[]},
  {id:3,name:'Lab Berbatu',moves:28,elems:['H','O','Na','Cl','C'],cols:6,rows:7,target:{reactions:7},obstacles:[[2,2],[3,4]]},
  {id:4,name:'Logam Alkali',moves:30,elems:['Na','Cl','Ca','K'],cols:7,rows:6,target:{reactions:8,score:1400},obstacles:[]},
  {id:5,name:'Reaksi Besi',moves:28,elems:['Fe','O','S','C','N'],cols:7,rows:7,target:{reactions:9},obstacles:[[0,3],[6,3]]},
  {id:6,name:'Full Periodik',moves:30,elems:['H','O','Na','Cl','C','N','Ca','Fe'],cols:7,rows:7,target:{reactions:10,score:2000},obstacles:[[2,2],[4,4],[2,4]]},
  {id:7,name:'Chaos Lab',moves:28,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:7,rows:7,target:{reactions:12,score:2500},obstacles:[[3,0],[3,6],[0,3],[6,3]]},
  {id:8,name:'Grand Synthesis',moves:32,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:8,rows:8,target:{reactions:15,score:3500},obstacles:[[0,0],[7,0],[0,7],[7,7],[3,3],[4,4]]},
];

const SAVE='chemcrush_v2';
const G={
  lv:null,board:[],sel:null,score:0,moves:0,reactions:0,busy:false,
  stars:{},scores:{},isWin:false,

  save(){try{localStorage.setItem(SAVE,JSON.stringify({stars:this.stars,scores:this.scores}));}catch(e){}},
  load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');this.stars=d.stars||{};this.scores=d.scores||{};}catch(e){}},

  toMap(){
    document.getElementById('s-game').classList.remove('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('s-map').classList.add('on');
    this.buildMap();
  },

  buildMap(){
    const g=document.getElementById('map-grid');g.innerHTML='';
    const maxU=Math.max(1,...Object.keys(this.stars).map(Number).filter(k=>this.stars[k]>0).map(k=>k+1));
    LEVELS.forEach(lv=>{
      const done=(this.stars[lv.id]||0)>0;
      const unlocked=lv.id<=maxU;
      const cur=lv.id===maxU&&!done;
      const cls=done?'done':cur?'current':unlocked?'unlocked':'';
      const starsStr=done?'★'.repeat(this.stars[lv.id])+'☆'.repeat(3-this.stars[lv.id]):'';
      const nd=document.createElement('div');nd.className='lvl-node';
      nd.innerHTML=`<div class="lvl-bubble ${cls}" onclick="${unlocked?'G.play('+lv.id+')':''}"><span>${lv.id}</span><span style="font-size:9px;opacity:0.7">${lv.elems.slice(0,2).join('·')}</span></div><div class="lvl-stars">${starsStr}</div><div class="lv-name">${lv.name}</div>`;
      g.appendChild(nd);
    });
  },

  play(id){
    const lv=LEVELS.find(l=>l.id===id);if(!lv)return;
    this.lv=lv;this.score=0;this.moves=lv.moves;this.reactions=0;this.sel=null;this.busy=false;
    this.initBoard();this.renderBoard();this.updateHUD();this.buildTargetBar();
    document.getElementById('s-map').classList.remove('on');
    document.getElementById('s-game').classList.add('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('fact-zone').innerHTML='';
    document.getElementById('h-lv').textContent='Lv.'+lv.id+' · '+lv.name;
  },

  initBoard(){
    const lv=this.lv;
    const obsSet=new Set(lv.obstacles.map(([c,r])=>r+','+c));
    this.board=[];
    for(let r=0;r<lv.rows;r++){
      this.board[r]=[];
      for(let c=0;c<lv.cols;c++){
        this.board[r][c]={elem:obsSet.has(r+','+c)?null:this.rndElem(),obstacle:obsSet.has(r+','+c)};
      }
    }
  },

  rndElem(){return this.lv.elems[Math.floor(Math.rando  .map-byline{font-size:13px;max-width:500px}
  .legend-wrap{max-width:560px}
  .lvl-grid{max-width:560px;grid-template-columns:repeat(4,1fr)}
  .lvl-bubble{width:76px;height:76px;font-size:18px}
}

.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink2);font-weight:800}
.leg-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}

.lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:380px}
.lvl-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.lvl-bubble{
  width:64px;height:64px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:15px;
  border:2px solid var(--border);background:var(--panel2);color:var(--muted);

}
.lvl-bubble.unlocked,.lvl-bubble.current,.lvl-bubble.done{cursor:pointer}
.lvl-bubble:hover.unlocked,.lvl-bubble:hover.current,.lvl-bubble:hover.done{transform:scale(1.06)}
.lvl-bubble:active{transform:scale(0.91)!important}
.lvl-bubble.unlocked{background:#e6f8ec;border-color:#70c880;color:#1a6030}

.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;width:100%;background:var(--panel);border-bottom:1.5px solid var(--border);box-shadow:0 2px 8px rgba(80,160,210,0.08);flex-shrink:0}
.hud-block{display:flex;flex-direction:column;align-items:center;gap:1px}
.hud-val{font-family:'Fredoka One',cursive;font-size:24px;color:var(--ink);line-height:1}
.hud-lbl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
.hud-lv{font-size:11px;color:var(--ink2);font-weight:800;text-align:center;max-width:150px;line-height:1.3}

.target-bar{display:flex;gap:6px;padding:6px 12px;width:100%;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0}
.target-pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1.5px solid var(--border);border-radius:999px;padding:4px 12px;font-size:11px;white-space:nowrap;font-weight:800;color:var(--ink2)}
.target-pill.done{opacity:0.4;text-decoration:line-through}
.target-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.prog-wrap{width:100%;height:6px;background:var(--sky2);flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,#50c880,#a0e840);transition:width .4s ease}

/* Mobile: board stacked vertically */
.game-body{display:flex;flex-direction:column;flex:1;width:100%;min-height:0}
.board-area{display:flex;align-items:center;justify-content:center;padding:12px 8px;flex:1;position:relative;min-height:0}
.board{display:grid;gap:4px;padding:10px;background:var(--panel);border-radius:18px;border:1.5px solid var(--border);box-shadow:var(--shadow)}

/* Side panel — hidden on mobile */
.side-panel{display:none}

/* Bottom bar (mobile) */
.bottom-bar{display:flex;gap:6px;padding:8px 12px;width:100%;background:var(--panel);border-top:1.5px solid var(--border);justify-content:center;flex-wrap:wrap;flex-shrink:0}
.btn-sm{background:var(--panel2);border:1.5px solid var(--border);border-radius:10px;padding:7px 13px;font-size:11px;font-weight:800;cursor:pointer;color:var(--ink2);font-family:'Nunito',sans-serif;transition:transform .1s,background .1s}
.btn-sm:hover{background:var(--sky2)}
.btn-sm:active{transform:scale(0.93)}
.btn-back{color:var(--muted)}

/* Fact zone mobile */
.fact-zone{position:fixed;bottom:68px;left:8px;right:8px;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center}

/* ══════════════════════════════
   GAME SCREEN — DESKTOP
   Board left | David panel right
══════════════════════════════ */
@media(min-width:860px){
  #s-game{flex-direction:column;min-height:100vh}

  .game-body{
    flex-direction:row;
    flex:1;
    align-items:stretch;
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:20px 24px;
    gap:20px;
    min-height:0;
  }

  /* Board column */
  .board-area{
    flex:0 0 auto;
    padding:0;
    align-items:flex-start;
    justify-content:center;
  }

  /* Side panel shows on desktop */
  .side-panel{
    display:flex;
    flex-direction:column;
    flex:1;
    gap:14px;
    min-width:260px;
    max-width:320px;
  }

  /* Bottom bar becomes part of the side panel on desktop */
  .bottom-bar{
    border-top:none;
    background:transparent;
    justify-content:flex-start;
    padding:0;
    flex-wrap:wrap;
    gap:8px;
  }

  /* Fact zone: inside side panel on desktop */
  .fact-zone{
    position:static;
    pointer-events:auto;
    align-items:stretch;
  }
}

/* ── DAVID PANEL CONTENT ── */
.david-card{background:var(--panel);border:1.5px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.david-avatar{width:110px;height:110px;background:linear-gradient(135deg,#e8f6fc,#d0ecf8);border:2px solid var(--border);border-radius:16px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0;position:relative}
.david-avatar img{width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity .25s ease}
.david-avatar img.hidden{opacity:0;position:absolute;inset:0}
.david-name{font-family:'Fredoka One',cursive;font-size:16px;color:var(--ink)}
.david-speech{background:var(--sky);border:1.5px solid var(--border);border-radius:12px;border-bottom-left-radius:4px;padding:8px 12px;font-size:11px;color:var(--ink2);line-height:1.6;font-weight:700;text-align:left;width:100%;min-height:48px;transition:all .3s ease}
.david-speech.react{background:var(--gold-light);border-color:#e8c860}
.david-speech.nope{background:#fff0f0;border-color:#f0a0a0}

.stats-card{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.stat-row{display:flex;justify-content:space-between;align-items:center}
.stat-label{font-size:11px;color:var(--muted);font-weight:800}
.stat-val{font-family:'Fredoka One',cursive;font-size:18px;color:var(--ink)}
.stat-divider{height:1px;background:var(--border)}

.rx-history{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto}
.rx-history-title{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.rx-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);font-weight:700;padding:3px 0;border-bottom:1px solid var(--border)}
.rx-item:last-child{border-bottom:none}
.rx-badge{font-size:12px;font-weight:900;color:var(--gold);flex-shrink:0}
.rx-pts{margin-left:auto;font-size:10px;color:var(--green);font-weight:900}
.rx-empty{font-size:11px;color:var(--muted);font-style:italic}

/* ── TILES ── */
.cell{
  border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  border:2px solid transparent;
  transition:transform .1s;
  box-shadow:0 2px 5px rgba(0,0,0,0.07);
}
.cell:active{transform:scale(0.9)}
.cell.selected{transform:scale(1.1);z-index:2;outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 4px 14px rgba(212,138,8,0.3)}
.cell.hint-glow{animation:hintpls .85s ease infinite}
.cell.obstacle{cursor:default;background:#ece4d8;border-color:#c8b898;box-shadow:none}
.cell.inert-cell{background:var(--sky2);border-color:var(--border);box-shadow:none;cursor:default}
@keyframes hintpls{0%,100%{box-shadow:0 0 0 0 rgba(212,138,8,0.5)}50%{box-shadow:0 0 0 6px rgba(212,138,8,0)}}

.cell[data-elem="H"]{background:#ddeeff;border-color:#88bbee}
.cell[data-elem="H"] .cs{color:#1a5898}.cell[data-elem="H"] .cn{color:#4488cc}
.cell[data-elem="O"]{background:#fde8e8;border-color:#f09090}
.cell[data-elem="O"] .cs{color:#c02020}.cell[data-elem="O"] .cn{color:#d05050}
.cell[data-elem="Na"]{background:#fdf6d8;border-color:#e8c840}
.cell[data-elem="Na"] .cs{color:#8a6200}.cell[data-elem="Na"] .cn{color:#aa8020}
.cell[data-elem="Cl"]{background:#e2f8e2;border-color:#70cc70}
.cell[data-elem="Cl"] .cs{color:#1a6a1a}.cell[data-elem="Cl"] .cn{color:#3a8a3a}
.cell[data-elem="C"]{background:#ececec;border-color:#aaaaaa}
.cell[data-elem="C"] .cs{color:#333333}.cell[data-elem="C"] .cn{color:#666666}
.cell[data-elem="N"]{background:#ece8ff;border-color:#aa88ee}
.cell[data-elem="N"] .cs{color:#4a1a9a}.cell[data-elem="N"] .cn{color:#7040ba}
.cell[data-elem="Ca"]{background:#fff0e0;border-color:#f0a850}
.cell[data-elem="Ca"] .cs{color:#8a4000}.cell[data-elem="Ca"] .cn{color:#aa6020}
.cell[data-elem="Fe"]{background:#fde8d8;border-color:#d08050}
.cell[data-elem="Fe"] .cs{color:#7a2000}.cell[data-elem="Fe"] .cn{color:#9a4020}
.cell[data-elem="S"]{background:#fffbd0;border-color:#d8c020}
.cell[data-elem="S"] .cs{color:#6a5000}.cell[data-elem="S"] .cn{color:#8a7010}
.cell[data-elem="K"]{background:#e8e8ff;border-color:#9090e0}
.cell[data-elem="K"] .cs{color:#1a1a88}.cell[data-elem="K"] .cn{color:#4040aa}
.cs{font-size:16px;font-weight:900;line-height:1}
.cn{font-size:8px;font-weight:800;line-height:1;margin-top:1px;opacity:0.8}

/* Fact card */
.fact-card{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;animation:slideUp .3s ease;box-shadow:0 4px 20px rgba(80,160,210,0.18);width:100%;max-width:420px}
.fact-reaction{font-size:14px;font-weight:900;color:var(--gold)}
.fact-title{font-size:11px;font-weight:800;color:var(--ink2)}
.fact-body{font-size:10.5px;color:var(--ink2);line-height:1.6;opacity:0.85}
.fact-noreact{border-color:#f0a0a0;background:#fff5f5}
.fact-noreact .fact-reaction{color:#c04040}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Float score text */
.float-txt{position:absolute;font-size:17px;font-weight:900;pointer-events:none;animation:floatUp .9s ease forwards;color:var(--gold);font-family:'Nunito',sans-serif;z-index:60;text-shadow:0 1px 4px rgba(0,0,0,0.12)}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-48px);opacity:0}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(180,220,240,0.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1.5px solid var(--border);border-radius:24px;padding:28px 24px;text-align:center;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 56px rgba(80,150,200,0.25);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(0.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-david{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#c4e5f5,#a8d8ef);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto;overflow:hidden}
.modal-david img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.modal-icon{font-size:52px}
.modal-stars{font-size:34px;letter-spacing:6px;color:var(--gold)}
.modal-title{font-family:'Fredoka One',cursive;font-size:26px;color:var(--ink)}
.modal-score{font-family:'Fredoka One',cursive;font-size:19px;color:var(--gold)}
.modal-sub{font-size:12px;color:var(--ink2);line-height:1.6}
.modal-fact{background:var(--sky);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--ink2);line-height:1.6;text-align:left;font-weight:700}
.btn-modal{border:none;border-radius:50px;padding:13px 0;font-family:'Fredoka One',cursive;font-size:18px;cursor:pointer;width:100%;transition:transform .12s}
.btn-modal:active{transform:scale(0.96)}
.btn-p{background:linear-gradient(135deg,#40b060,#60d080);color:#fff}
.btn-s{background:var(--sky2);color:var(--ink);border:1.5px solid var(--border)}
</style>
</head>
<body>

<!-- ══ MAP ══ -->
<div id="s-map" class="screen on">
  <div class="map-header">
    <div class="map-title">⚗️ Chem Crush</div>
    <div class="map-byline">Swap elemen yang bisa <strong>bereaksi satu sama lain</strong><br>— bukan yang warnanya sama!</div>
    <div class="map-badge">14 reaksi kimia nyata · 8 level</div>
  </div>
  <div class="legend-wrap">
    <div class="leg-item"><div class="leg-dot" style="background:#88bbee"></div>H Hidrogen</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f09090"></div>O Oksigen</div>
    <div class="leg-item"><div class="leg-dot" style="background:#aaaaaa"></div>C Karbon</div>
    <div class="leg-item"><div class="leg-dot" style="background:#70cc70"></div>Cl Klorin</div>
    <div class="leg-item"><div class="leg-dot" style="background:#e8c840"></div>Na Natrium</div>
    <div class="leg-item"><div class="leg-dot" style="background:#aa88ee"></div>N Nitrogen</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f0a850"></div>Ca Kalsium</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d08050"></div>Fe Besi</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d8c020"></div>S Sulfur</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9090e0"></div>K Kalium</div>
  </div>
  <div class="lvl-grid" id="map-grid"></div>
</div>

<!-- ══ GAME ══ -->
<div id="s-game" class="screen">
  <!-- HUD (full width, top) -->
  <div class="hud">
    <div class="hud-block">
      <div class="hud-val" id="h-moves">20</div>
      <div class="hud-lbl">Moves</div>
    </div>
    <div class="hud-block">
      <div class="hud-lv" id="h-lv">Level 1</div>
      <div class="hud-val" id="h-score">0</div>
      <div class="hud-lbl">Skor</div>
    </div>
    <div class="hud-block">
      <div class="hud-val" id="h-rx">0</div>
      <div class="hud-lbl">Reaksi</div>
    </div>
  </div>
  <div class="target-bar" id="target-bar"></div>
  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>

  <!-- Body: board + side panel -->
  <div class="game-body">

    <!-- Board -->
    <div class="board-area" id="board-area">
      <div class="board" id="board"></div>
    </div>

    <!-- Side panel (desktop only) -->
    <div class="side-panel">

      <!-- David -->
      <div class="david-card">
        <div class="david-avatar" id="david-avatar">
          <img id="d-idle"    src="https://raw.githubusercontent.com/pipit10364/David/main/David%20mempersilakan.png" alt="David" onerror="this.style.display='none'">
          <img id="d-aha"     src="https://raw.githubusercontent.com/pipit10364/David/main/David%20aha.png"           alt="David aha" class="hidden" onerror="this.style.display='none'">
          <img id="d-think"   src="https://raw.githubusercontent.com/pipit10364/David/main/david%20thinking.png"      alt="David thinking" class="hidden" onerror="this.style.display='none'">
          <img id="d-wow"     src="https://raw.githubusercontent.com/pipit10364/David/main/Untitled11_20260517083604.png" alt="David wow" class="hidden" onerror="this.style.display='none'">
        </div>
        <div class="david-name">David 🧪</div>
        <div class="david-speech" id="david-speech">Halo! Swap dua elemen yang bisa bereaksi satu sama lain. Kimia itu seru, ayo kita mulai!</div>
      </div>

      <!-- Stats -->
      <div class="stats-card">
        <div class="stat-row">
          <div class="stat-label">Moves tersisa</div>
          <div class="stat-val" id="sp-moves">—</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-row">
          <div class="stat-label">Total skor</div>
          <div class="stat-val" id="sp-score">0</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-row">
          <div class="stat-label">Reaksi berhasil</div>
          <div class="stat-val" id="sp-rx">0</div>
        </div>
      </div>

      <!-- Reaction history -->
      <div class="rx-history" id="rx-history">
        <div class="rx-history-title">Riwayat Reaksi</div>
        <div class="rx-empty" id="rx-empty">Belum ada reaksi...</div>
      </div>

      <!-- Boosts (desktop) -->
      <div class="bottom-bar">
        <button class="btn-sm" onclick="G.boost('hint')">💡 Hint</button>
        <button class="btn-sm" onclick="G.boost('shuffle')">🔀 Shuffle</button>
        <button class="btn-sm" onclick="G.boost('catalyst')">⚡ Catalyst</button>
        <button class="btn-sm btn-back" onclick="G.toMap()">← Map</button>
      </div>

      <!-- Fact zone (desktop: inside panel) -->
      <div class="fact-zone" id="fact-zone-desktop"></div>
    </div>

  </div><!-- /game-body -->

  <!-- Boosts (mobile only) -->
  <div class="bottom-bar" id="mobile-bar">
    <button class="btn-sm" onclick="G.boost('hint')">💡 Hint</button>
    <button class="btn-sm" onclick="G.boost('shuffle')">🔀 Shuffle</button>
    <button class="btn-sm" onclick="G.boost('catalyst')">⚡ Catalyst</button>
    <button class="btn-sm btn-back" onclick="G.toMap()">← Map</button>
  </div>

  <!-- Fact zone (mobile: fixed bottom) -->
  <div class="fact-zone" id="fact-zone-mobile" style="position:fixed;bottom:68px;left:8px;right:8px;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center"></div>
</div>

<!-- ══ MODAL ══ -->
<div class="modal-bg" id="modal-wrap">
  <div class="modal">
    <div class="modal-david" id="m-david">
      <img id="md-idle" src="https://raw.githubusercontent.com/pipit10364/David/main/David%20mempersilakan.png" onerror="this.style.display='none'" alt="David" style="width:100%;height:100%;object-fit:contain">
      <img id="md-aha"  src="https://raw.githubusercontent.com/pipit10364/David/main/David%20aha.png" onerror="this.style.display='none'" alt="David aha" style="width:100%;height:100%;object-fit:contain;display:none">
      <img id="md-wow"  src="https://raw.githubusercontent.com/pipit10364/David/main/Untitled11_20260517083604.png" onerror="this.style.display='none'" alt="David wow" style="width:100%;height:100%;object-fit:contain;display:none">
    </div>
    <div class="modal-icon" id="m-icon">🎉</div>
    <div class="modal-stars" id="m-stars"></div>
    <div class="modal-title" id="m-title">Sintesis Berhasil!</div>
    <div class="modal-score" id="m-score"></div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="modal-fact" id="m-fact"></div>
    <button class="btn-modal btn-p" id="m-btn1" onclick="G.mb1()">Lanjut</button>
    <button class="btn-modal btn-s" id="m-btn2" onclick="G.mb2()">Ulang</button>
  </div>
</div>

<script>
const ELEMENTS={
  H:{sym:'H',name:'Hidrogen'},O:{sym:'O',name:'Oksigen'},
  Na:{sym:'Na',name:'Natrium'},Cl:{sym:'Cl',name:'Klorin'},
  C:{sym:'C',name:'Karbon'},N:{sym:'N',name:'Nitrogen'},
  Ca:{sym:'Ca',name:'Kalsium'},Fe:{sym:'Fe',name:'Besi'},
  S:{sym:'S',name:'Sulfur'},K:{sym:'K',name:'Kalium'},
};

const REACTIONS=[
  {elems:['H','O'],product:'H₂O',pts:150,name:'Air',
   davidSay:'Air! H₂O — pelarut universal. 2 hidrogen + 1 oksigen, ikatannya polar banget!',
   fact:'H₂O terbentuk dari 2 atom hidrogen + 1 oksigen. Ikatan kovalen polar-nya bikin air bisa melarutkan hampir segalanya — itulah kenapa air disebut "universal solvent".'},
  {elems:['Na','Cl'],product:'NaCl',pts:180,name:'Garam dapur',
   davidSay:'NaCl! Dari logam yang meledak + gas beracun, jadi garam dapur. Kimia itu ajaib!',
   fact:'NaCl terbentuk dari reaksi hebat antara logam Na yang meledak di air dan gas Cl₂ yang beracun. Hasilnya: kristal yang aman dimakan!'},
  {elems:['C','O'],product:'CO₂',pts:160,name:'Karbon dioksida',
   davidSay:'CO₂! Produk pembakaran sekaligus respirasi sel. Tiap napasmu mengandung ini.',
   fact:'CO₂ dihasilkan dari pembakaran karbon dengan oksigen — juga produk respirasi selular. Tiap napas yang kamu keluarkan mengandung CO₂ hasil metabolisme tubuhmu.'},
  {elems:['N','H'],product:'NH₃',pts:200,name:'Amonia',
   davidSay:'NH₃! Amonia — dasar dari semua protein di tubuhmu. Proses Haber-Bosch mengubah dunia!',
   fact:'NH₃ penting dalam biosintesis protein. Proses Haber-Bosch yang mensintesisnya dari N₂+H₂ adalah penemuan kimia terpenting abad 20.'},
  {elems:['Ca','O'],product:'CaO',pts:170,name:'Kapur bakar',
   davidSay:'CaO — kapur bakar! Tambah air jadi semen. Literally bahan bangunan peradaban.',
   fact:'CaO dari pemanasan batu kapur. Dicampur air jadi Ca(OH)₂ — bahan semen yang membangun peradaban manusia ribuan tahun.'},
  {elems:['Fe','O'],product:'Fe₂O₃',pts:160,name:'Karat besi',
   davidSay:'Fe₂O₃ — karat! Mars berwarna merah karena planet itu sedang berkarat. Serius!',
   fact:'Fe₂O₃ adalah karat besi. Di Mars, Fe₂O₃ yang melimpah bikin planet itu berwarna merah — Mars adalah planet yang sedang berkarat!'},
  {elems:['S','O'],product:'SO₂',pts:175,name:'Sulfur dioksida',
   davidSay:'SO₂ — biang hujan asam. Gas ini dari pembakaran batu bara yang mencemari atmosfer.',
   fact:'SO₂ dari pembakaran bahan bakar fosil. Di atmosfer bereaksi jadi H₂SO₄ — hujan asam yang merusak hutan dan bangunan bersejarah.'},
  {elems:['K','O'],product:'K₂O',pts:165,name:'Kalium oksida',
   davidSay:'Kalium + Oksigen! Hati-hati, logam K bisa terbakar spontan di udara lho!',
   fact:'Kalium sangat reaktif — bisa terbakar spontan di udara dan meledak jika kena air. Logam alkali disimpan dalam minyak mineral.'},
  {elems:['Na','O'],product:'Na₂O',pts:170,name:'Natrium oksida',
   davidSay:'Na₂O! Kena air langsung jadi soda api. Reaksi berantai yang berbahaya!',
   fact:'Na₂O kena air langsung jadi NaOH (soda api) yang sangat korosif. Dipakai untuk membuat sabun dan memurnikan aluminium.'},
  {elems:['C','N'],product:'CN⁻',pts:220,name:'Sianida',
   davidSay:'CN⁻ — sianida! Beracun karena blokir respirasi sel. Tapi dipakai murni emas. Paradoks!',
   fact:'Ion CN⁻ sangat beracun — blokir sitokrom c oksidase, enzim vital respirasi sel. Ironisnya, dipakai industri perhiasan untuk memurnikan emas.'},
  {elems:['H','N'],product:'HNO₃',pts:210,name:'Asam nitrat',
   davidSay:'HNO₃ — asam nitrat! Bahan pupuk sekaligus bahan peledak. Nitrogen itu powerful!',
   fact:'HNO₃ digunakan dalam pembuatan pupuk dan bahan peledak. Di tubuh, nitrogen dari protein dipecah jadi urea untuk dibuang.'},
  {elems:['Ca','Cl'],product:'CaCl₂',pts:185,name:'Kalsium klorida',
   davidSay:'CaCl₂! Super higroskopis — nyedot uap air dari udara. Ion Ca²⁺ juga bikin otot kontraksi!',
   fact:'CaCl₂ sangat higroskopis — menyerap uap air dari udara. Di sel tubuh, Ca²⁺ adalah sinyal penting untuk kontraksi otot dan transmisi sinyal saraf.'},
  {elems:['Fe','S'],product:'FeS',pts:175,name:'Besi sulfida',
   davidSay:'FeS — mineral kerak bumi! Ada di mana-mana, dari tanah sampai inti bumi.',
   fact:'FeS terbentuk dari reaksi langsung besi dan sulfur saat dipanaskan. Mineral ini banyak ditemukan di kerak bumi!'},
  {elems:['K','Cl'],product:'KCl',pts:180,name:'Kalium klorida',
   davidSay:'KCl — pengganti garam untuk hipertensi! Ion K⁺ juga ngatur ritme jantungmu.',
   fact:'KCl digunakan sebagai pengganti garam bagi penderita hipertensi. Ion K⁺ sangat vital mengatur ritme detak jantung.'},
];

const DAVID_IDLE=[
  'Hmm, cari pasangan yang bisa bereaksi ya... bukan yang kembar!',
  'Ingat: H + O bisa jadi air. Na + Cl bisa jadi garam. Beda elemen, bukan sama!',
  'Pakai Hint kalau bingung — aku akan tunjukkan pasangannya!',
  'Kimia itu tentang hubungan antar elemen, bukan kesamaan. Filosofis ya? 😄',
  'Setiap swap yang bereaksi = chemistry fact baru untukmu!',
];

const RXMAP={};
REACTIONS.forEach(rx=>{RXMAP[rx.elems.slice().sort().join('|')]=rx;});
function getRx(a,b){return RXMAP[[a,b].sort().join('|')]||null;}

const LEVELS=[
  {id:1,name:'H₂O & NaCl',moves:28,elems:['H','O','Na','Cl'],cols:6,rows:6,target:{reactions:5},obstacles:[]},
  {id:2,name:'Karbon Masuk',moves:28,elems:['H','O','C','N'],cols:6,rows:6,target:{reactions:6,score:900},obstacles:[]},
  {id:3,name:'Lab Berbatu',moves:28,elems:['H','O','Na','Cl','C'],cols:6,rows:7,target:{reactions:7},obstacles:[[2,2],[3,4]]},
  {id:4,name:'Logam Alkali',moves:30,elems:['Na','Cl','Ca','K'],cols:7,rows:6,target:{reactions:8,score:1400},obstacles:[]},
  {id:5,name:'Reaksi Besi',moves:28,elems:['Fe','O','S','C','N'],cols:7,rows:7,target:{reactions:9},obstacles:[[0,3],[6,3]]},
  {id:6,name:'Full Periodik',moves:30,elems:['H','O','Na','Cl','C','N','Ca','Fe'],cols:7,rows:7,target:{reactions:10,score:2000},obstacles:[[2,2],[4,4],[2,4]]},
  {id:7,name:'Chaos Lab',moves:28,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:7,rows:7,target:{reactions:12,score:2500},obstacles:[[3,0],[3,6],[0,3],[6,3]]},
  {id:8,name:'Grand Synthesis',moves:32,elems:['H','O','Na','Cl','C','N','Ca','Fe','S','K'],cols:8,rows:8,target:{reactions:15,score:3500},obstacles:[[0,0],[7,0],[0,7],[7,7],[3,3],[4,4]]},
];

const SAVE='chemcrush_v3';
const G={
  lv:null,board:[],sel:null,score:0,moves:0,reactions:0,busy:false,
  stars:{},scores:{},isWin:false,rxLog:[],
  idleTimer:null,

  save(){try{localStorage.setItem(SAVE,JSON.stringify({stars:this.stars,scores:this.scores}));}catch(e){}},
  load(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'{}');this.stars=d.stars||{};this.scores=d.scores||{};}catch(e){}},

  isDesktop(){return window.innerWidth>=860},

  factZone(){
    return this.isDesktop()
      ? document.getElementById('fact-zone-desktop')
      : document.getElementById('fact-zone-mobile');
  },

  toMap(){
    document.getElementById('s-game').classList.remove('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('s-map').classList.add('on');
    clearTimeout(this.idleTimer);
    this.buildMap();
  },

  buildMap(){
    const g=document.getElementById('map-grid');g.innerHTML='';
    const maxU=Math.max(1,...Object.keys(this.stars).map(Number).filter(k=>this.stars[k]>0).map(k=>k+1));
    LEVELS.forEach(lv=>{
      const done=(this.stars[lv.id]||0)>0;
      const unlocked=lv.id<=maxU;
      const cur=lv.id===maxU&&!done;
      const cls=done?'done':cur?'current':unlocked?'unlocked':'';
      const st=done?'★'.repeat(this.stars[lv.id])+'☆'.repeat(3-this.stars[lv.id]):'';
      const nd=document.createElement('div');nd.className='lvl-node';
      nd.innerHTML=`<div class="lvl-bubble ${cls}" onclick="${unlocked?'G.play('+lv.id+')':''}"><span>${lv.id}</span><span style="font-size:9px;opacity:0.7">${lv.elems.slice(0,2).join('·')}</span></div><div class="lvl-stars">${st}</div><div class="lv-name">${lv.name}</div>`;
      g.appendChild(nd);
    });
  },

  play(id){
    const lv=LEVELS.find(l=>l.id===id);if(!lv)return;
    this.lv=lv;this.score=0;this.moves=lv.moves;this.reactions=0;
    this.sel=null;this.busy=false;this.rxLog=[];
    this.initBoard();this.renderBoard();this.updateHUD();this.buildTargetBar();
    this.updateSidePanel();this.renderRxHistory();
    document.getElementById('s-map').classList.remove('on');
    document.getElementById('s-game').classList.add('on');
    document.getElementById('modal-wrap').classList.remove('on');
    document.getElementById('fact-zone-desktop').innerHTML='';
    document.getElementById('fact-zone-mobile').innerHTML='';
    document.getElementById('h-lv').textContent='Lv.'+lv.id+' · '+lv.name;
    this.davidSay(DAVID_IDLE[Math.floor(Math.random()*DAVID_IDLE.length)],'');
    this.davidExpr('idle');
    this.scheduleIdle();
  },

  scheduleIdle(){
    clearTimeout(this.idleTimer);
    this.idleTimer=setTimeout(()=>{
      if(!this.busy){this.davidSay(DAVID_IDLE[Math.floor(Math.random()*DAVID_IDLE.length)],'');this.davidExpr('idle');}
      this.scheduleIdle();
    },7000);
  },

  davidExpr(expr){
    // expr: 'idle' | 'aha' | 'think' | 'wow'
    const map={idle:'d-idle',aha:'d-aha',think:'d-think',wow:'d-wow'};
    Object.entries(map).forEach(([k,id])=>{
      const el=document.getElementById(id);
      if(!el)return;
      if(k===expr){el.classList.remove('hidden');}
      else{el.classList.add('hidden');}
    });
  },

  davidModalExpr(expr){
    const show=expr==='win'?'md-aha':'md-wow';
    ['md-idle','md-aha','md-wow'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.style.display=(id===show?'block':'none');
    });
  },

  davidSay(msg,cls){
    const el=document.getElementById('david-speech');
    if(!el)return;
    el.className='david-speech'+(cls?' '+cls:'');
    el.textContent=msg;
  },

  initBoard(){
    const lv=this.lv;
    const obsSet=new Set(lv.obstacles.map(([c,r])=>r+','+c));
    this.board=[];
    for(let r=0;r<lv.rows;r++){
      this.board[r]=[];
      for(let c=0;c<lv.cols;c++)
        this.board[r][c]={elem:obsSet.has(r+','+c)?null:this.rndElem(),obstacle:obsSet.has(r+','+c)};
    }
  },

  rndElem(){return this.lv.elems[Math.floor(Math.random()*this.lv.elems.length)];},

  renderBoard(){
    const lv=this.lv,b=this.board;
    const bd=document.getElementById('board');
    const avail=this.isDesktop()?Math.min(window.innerWidth*0.5,520):Math.min(window.innerWidth-24,400);
    const sz=Math.min(48,Math.floor((avail-24)/(lv.cols)));
    bd.style.gridTemplateColumns=`repeat(${lv.cols},${sz}px)`;
    bd.innerHTML='';
    for(let r=0;r<lv.rows;r++){
      for(let c=0;c<lv.cols;c++){
        const cell=b[r][c];
        const div=document.createElement('div');
        div.className='cell';div.dataset.r=r;div.dataset.c=c;
        div.style.width=sz+'px';div.style.height=sz+'px';
        if(cell.obstacle){
          div.classList.add('obstacle');
          div.innerHTML='<span style="font-size:20px">🧱</span>';
        } else if(cell.elem){
          div.dataset.elem=cell.elem;
          const el=ELEMENTS[cell.elem];
          div.innerHTML=`<div class="cs">${el.sym}</div><div class="cn">${el.name.substring(0,6)}</div>`;
          if(this.sel&&this.sel[0]===r&&this.sel[1]===c) div.classList.add('selected');
          div.onclick=()=>this.tap(r,c);
        } else {
          div.classList.add('inert-cell');
        }
        bd.appendChild(div);
      }
    }
  },

  tap(r,c){
    if(this.busy)return;
    const cell=this.board[r][c];
    if(!cell.elem||cell.obstacle)return;
    if(!this.sel){this.sel=[r,c];this.renderBoard();return;}
    const[sr,sc]=this.sel;
    if(sr===r&&sc===c){this.sel=null;this.renderBoard();return;}
    if(Math.abs(sr-r)+Math.abs(sc-c)===1){this.sel=null;this.trySwap(sr,sc,r,c);}
    else{this.sel=[r,c];this.renderBoard();}
  },

  trySwap(r1,c1,r2,c2){
    const b=this.board;
    const a=b[r1][c1].elem,bE=b[r2][c2].elem;
    const rx=getRx(a,bE);
    if(!rx){this.noReact(r1,c1,r2,c2);return;}
    this.moves--;this.busy=true;
    b[r1][c1].elem=null;b[r2][c2].elem=null;
    this.renderBoard();
    this.reactions++;this.score+=rx.pts;
    this.rxLog.unshift(rx);
    if(this.rxLog.length>8)this.rxLog.pop();
    this.floatPts(rx.pts,r1,c1);
    this.showFact(rx);
    this.davidSay(rx.davidSay,'react');
    this.davidExpr('aha');
    this.renderRxHistory();
    clearTimeout(this.idleTimer);
    this.idleTimer=setTimeout(()=>this.scheduleIdle(),5000);
    setTimeout(()=>{
      this.gravity();this.fillBoard();
      this.renderBoard();this.updateHUD();this.buildTargetBar();this.updateSidePanel();
      this.busy=false;this.checkEnd();
    },600);
  },

  noReact(r1,c1,r2,c2){
    const b=this.board;
    [b[r1][c1].elem,b[r2][c2].elem]=[b[r2][c2].elem,b[r1][c1].elem];
    this.moves--;this.renderBoard();this.updateHUD();this.updateSidePanel();
    this.showNoReact();
    this.davidSay('Itu tidak bereaksi... coba pasangan lain. Gunakan Hint kalau perlu!','nope');
    this.davidExpr('wow');
    if(this.moves<=0)setTimeout(()=>this.checkEnd(),300);
  },

  gravity(){
    const lv=this.lv,b=this.board;
    for(let c=0;c<lv.cols;c++){
      let empty=lv.rows-1;
      for(let r=lv.rows-1;r>=0;r--){
        if(b[r][c].obstacle){empty=r-1;continue;}
        if(b[r][c].elem){
          if(r!==empty){b[empty][c].elem=b[r][c].elem;b[r][c].elem=null;}
          empty--;
        }
      }
    }
  },

  fillBoard(){
    const lv=this.lv,b=this.board;
    for(let r=0;r<lv.rows;r++)
      for(let c=0;c<lv.cols;c++)
        if(!b[r][c].obstacle&&!b[r][c].elem) b[r][c].elem=this.rndElem();
  },

  floatPts(pts,r,c){
    const ba=document.getElementById('board-area');
    const bdRect=document.getElementById('board').getBoundingClientRect();
    const baRect=ba.getBoundingClientRect();
    const sz=Math.min(48,Math.floor((this.isDesktop()?Math.min(window.innerWidth*0.5,520):Math.min(window.innerWidth-24,400)-24)/this.lv.cols));
    const el=document.createElement('div');
    el.className='float-txt';el.textContent='+'+pts;
    el.style.left=(bdRect.left-baRect.left+c*(sz+4)+10+sz*.2)+'px';
    el.style.top=(bdRect.top-baRect.top+r*(sz+4)+10)+'px';
    ba.style.position='relative';ba.appendChild(el);
    setTimeout(()=>el.remove(),950);
  },

  showFact(rx){
    const zone=this.factZone();
    const old=zone.querySelector('.fact-card');if(old)old.remove();
    const div=document.createElement('div');div.className='fact-card';
    div.innerHTML=`<div class="fact-reaction">${rx.elems.join(' + ')} → ${rx.product}</div><div class="fact-title">⚗️ ${rx.name}</div><div class="fact-body">${rx.fact}</div>`;
    zone.appendChild(div);
    setTimeout(()=>{if(div.parentNode)div.remove();},4500);
  },

  showNoReact(){
    const zone=this.factZone();
    const old=zone.querySelector('.fact-card');if(old)old.remove();
    const div=document.createElement('div');div.className='fact-card fact-noreact';
    div.innerHTML=`<div class="fact-reaction">Tidak bereaksi ❌</div><div class="fact-body">Elemen ini tidak membentuk reaksi langsung. Cari pasangan yang tepat!</div>`;
    zone.appendChild(div);
    setTimeout(()=>{if(div.parentNode)div.remove();},2200);
  },

  updateHUD(){
    document.getElementById('h-moves').textContent=this.moves;
    document.getElementById('h-score').textContent=this.score.toLocaleString();
    document.getElementById('h-rx').textContent=this.reactions;
    const t=this.lv.target;
    const rxGoal=t.reactions||0,scGoal=t.score||0;
    let pct=0;
    if(rxGoal&&!scGoal) pct=Math.min(100,this.reactions/rxGoal*100);
    else if(scGoal&&!rxGoal) pct=Math.min(100,this.score/scGoal*100);
    else pct=Math.min(100,Math.min(this.reactions/rxGoal,this.score/scGoal)*100);
    document.getElementById('prog').style.width=Math.round(pct)+'%';
  },

  updateSidePanel(){
    const sm=document.getElementById('sp-moves');
    const ss=document.getElementById('sp-score');
    const sr=document.getElementById('sp-rx');
    if(sm) sm.textContent=this.moves;
    if(ss) ss.textContent=this.score.toLocaleString();
    if(sr) sr.textContent=this.reactions;
  },

  renderRxHistory(){
    const hist=document.getElementById('rx-history');
    const empty=document.getElementById('rx-empty');
    if(!hist)return;
    const existing=hist.querySelectorAll('.rx-item');
    existing.forEach(e=>e.remove());
    if(this.rxLog.length===0){
      if(empty)empty.style.display='';
      return;
    }
    if(empty)empty.style.display='none';
    this.rxLog.forEach(rx=>{
      const div=document.createElement('div');div.className='rx-item';
      div.innerHTML=`<div class="rx-badge">${rx.elems.join('+')}</div><div>→ ${rx.product} (${rx.name})</div><div class="rx-pts">+${rx.pts}</div>`;
      hist.appendChild(div);
    });
  },

  buildTargetBar(){
    const t=this.lv.target;
    const bar=document.getElementById('target-bar');bar.innerHTML='';
    const add=(color,text,done)=>{
      const p=document.createElement('div');p.className='target-pill'+(done?' done':'');
      p.innerHTML=`<div class="target-dot" style="background:${color}"></div>${text}`;
      bar.appendChild(p);
    };
    if(t.reactions) add('#a060f0',`${this.reactions}/${t.reactions} reaksi`,this.reactions>=t.reactions);
    if(t.score) add('#d48a08',`${this.score.toLocaleString()}/${t.score.toLocaleString()} skor`,this.score>=t.score);
  },

  checkEnd(){
    const t=this.lv.target;
    const rxOk=!t.reactions||(this.reactions>=t.reactions);
    const scOk=!t.score||(this.score>=t.score);
    if(rxOk&&scOk){this.win();return;}
    if(this.moves<=0){this.lose();}
  },

  win(){
    clearTimeout(this.idleTimer);
    this.busy=true;
    const lv=this.lv;
    let stars=this.moves>=Math.floor(lv.moves*.5)?3:this.moves>=Math.floor(lv.moves*.15)?2:1;
    const prev=this.stars[lv.id]||0;
    if(stars>prev)this.stars[lv.id]=stars;
    if(!this.scores[lv.id]||this.score>this.scores[lv.id])this.scores[lv.id]=this.score;
    this.save();
    const isLast=lv.id>=LEVELS.length;
    const rx=REACTIONS[Math.floor(Math.random()*REACTIONS.length)];
    this.isWin=true;
    this.davidModalExpr('win');
    this.showModal('🎉','★'.repeat(stars)+'☆'.repeat(3-stars),'Sintesis Berhasil!',
      `${this.score.toLocaleString()} poin · ${this.reactions} reaksi`,
      isLast?'Semua level selesai! Kamu udah jadi ahli kimia sejati 🏆':'Bagus! Kimia-mu makin tajam.',
      `Fun fact: ${rx.elems.join(' + ')} → ${rx.product} — ${rx.fact}`,
      isLast?'Main Lagi':'Level Berikutnya','Ulang Level');
  },

  lose(){
    clearTimeout(this.idleTimer);
    this.busy=true;this.isWin=false;
    this.davidModalExpr('lose');
    const rx=REACTIONS[Math.floor(Math.random()*REACTIONS.length)];
    this.showModal('😰','','Moves Habis!',
      `${this.score.toLocaleString()} poin · ${this.reactions} reaksi`,
      'Fokus cari pasangan yang bisa bereaksi — jangan swap sembarangan!',
      `Tips: ${rx.elems.join(' + ')} → ${rx.product} (${rx.name})`,
      'Coba Lagi','Ke Map');
  },

  showModal(icon,stars,title,score,sub,fact,b1,b2){
    document.getElementById('m-icon').textContent=icon;
    document.getElementById('m-stars').textContent=stars;
    document.getElementById('m-title').textContent=title;
    document.getElementById('m-score').textContent=score;
    document.getElementById('m-sub').textContent=sub;
    document.getElementById('m-fact').textContent=fact;
    document.getElementById('m-btn1').textContent=b1;
    document.getElementById('m-btn2').textContent=b2;
    document.getElementById('modal-wrap').classList.add('on');
  },

  mb1(){
    document.getElementById('modal-wrap').classList.remove('on');
    if(this.isWin){const next=LEVELS.find(l=>l.id===this.lv.id+1);if(next)this.play(next.id);else this.toMap();}
    else this.play(this.lv.id);
  },
  mb2(){
    document.getElementById('modal-wrap').classList.remove('on');
    if(this.isWin)this.play(this.lv.id);else this.toMap();
  },

  boost(type){
    if(this.busy)return;
    if(type==='hint'){
      const lv=this.lv,b=this.board;
      for(let r=0;r<lv.rows;r++) for(let c=0;c<lv.cols;c++){
        if(!b[r][c].elem||b[r][c].obstacle)continue;
        for(const[dr,dc]of[[0,1],[1,0]]){
          const nr=r+dr,nc=c+dc;
          if(nr<0||nr>=lv.rows||nc<0||nc>=lv.cols)continue;
          if(!b[nr][nc].elem||b[nr][nc].obstacle)continue;
          if(getRx(b[r][c].elem,b[nr][nc].elem)){
            [document.querySelector(`[data-r="${r}"][data-c="${c}"]`),
             document.querySelector(`[data-r="${nr}"][data-c="${nc}"]`)]
            .forEach(el=>{if(el){el.classList.add('hint-glow');setTimeout(()=>el.classList.remove('hint-glow'),1300);}});
            this.davidSay('Itu dia! Coba swap dua yang aku highlight 👆','react');
            this.davidExpr('think');
            return;
          }
        }
      }
      this.davidSay('Wah, board lagi susah nih. Coba Shuffle dulu?','nope');
      this.davidExpr('wow');
      this.showNoReact();
    }
    if(type==='shuffle'){
      const lv=this.lv,b=this.board;
      const pool=[];
      for(let r=0;r<lv.rows;r++) for(let c=0;c<lv.cols;c++) if(!b[r][c].obstacle&&b[r][c].elem) pool.push(b[r][c].elem);
      pool.sort(()=>Math.random()-.5);let i=0;
      for(let r=0;r<lv.rows;r++) for(let c=0;c<lv.cols;c++) if(!b[r][c].obstacle&&b[r][c].elem) b[r][c].elem=pool[i++];
      this.renderBoard();
      this.davidSay('Board diacak! Sekarang cari pasangan yang bisa bereaksi 🔍','');
      this.davidExpr('idle');
    }
    if(type==='catalyst'){
      const lv=this.lv,b=this.board;
      const cands=[];
      for(let r=0;r<lv.rows;r++) for(let c=0;c<lv.cols;c++) if(!b[r][c].obstacle&&b[r][c].elem) cands.push([r,c]);
      cands.sort(()=>Math.random()-.5).slice(0,3).forEach(([r,c])=>{b[r][c].elem=this.rndElem();});
      this.renderBoard();
      this.davidSay('Katalis aktif! 3 elemen diganti. Katalis itu mempercepat reaksi tanpa ikut bereaksi — kayak enzim di tubuhmu!','react');
      this.davidExpr('aha');
    }
  },
};

G.load();G.buildMap();
</script>
