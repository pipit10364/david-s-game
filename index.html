<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David's Kitchen - Level 1: Matcha</title>
    <style>
        /* CSS UNTUK TAMPILAN LANDSCAPE & ESTETIK */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            color: #333;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #f9fbf2;
            border: 6px solid #4a7c44;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .active { display: flex; }

        /* Dialog David */
        .david-char {
            width: 150px;
            margin-bottom: 10px;
        }

        .dialog-box {
            background: white;
            border: 2px solid #4a7c44;
            padding: 15px;
            border-radius: 15px;
            max-width: 80%;
        }

        /* Cooking Stage Meter */
        .meter-container {
            width: 300px;
            height: 40px;
            background: #ddd;
            border-radius: 20px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }

        .target-zone {
            position: absolute;
            left: 70%; 
            width: 15%;
            height: 100%;
            background: #76ba1b;
        }

        #indicator {
            position: absolute;
            left: 0%;
            width: 8px;
            height: 100%;
            background: red;
        }

        /* Serving Stage */
        #customer-area {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            height: 200px;
        }

        .customer {
            width: 120px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            animation: fadeIn 0.5s;
        }

        .patience-bar {
            height: 8px;
            background: #e74c3c;
            width: 100%;
            margin: 5px 0;
        }

        .btn {
            padding: 10px 20px;
            background: #4a7c44;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover { background: #3d6638; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. INTRO -->
    <div id="screen-intro" class="screen active">
        <!-- Ganti 'david.png' dengan link gambar David di github kamu nanti -->
        <img src="https://via.placeholder.com/150" class="david-char" alt="David">
        <div class="dialog-box">
            <h3>David: "Ayo Magang!"</h3>
            <p>Matcha itu sensitif. Kita butuh suhu <b>80°C</b> supaya zat <b>L-Theanine</b> terjaga dan <b>Tanin</b> gak bikin pahit. Siap bantu aku rebus air?</p>
            <button class="btn" onclick="startCooking()">Siap, David!</button>
        </div>
    </div>

    <!-- 2. COOKING -->
    <div id="screen-cooking" class="screen">
        <h2>Target: 80°C (Area Hijau)</h2>
        <div class="meter-container">
            <div class="target-zone"></div>
            <div id="indicator"></div>
        </div>
        <button class="btn" onclick="stopCooking()">STOP SEKARANG!</button>
    </div>

    <!-- 3. SERVING -->
    <div id="screen-serving" class="screen">
        <div id="stat-bar" style="position:absolute; top:10px; width:90%; display:flex; justify-content:space-between">
            <span>Score: <b id="score-val">0</b></span>
            <span>Kualitas: <b id="quality-val">-</b></span>
        </div>
        <div id="customer-area"></div>
        <button class="btn" onclick="endGame()" style="margin-top:30px">Tutup Kedai</button>
    </div>

    <!-- 4. RESULT -->
    <div id="screen-result" class="screen">
        <h2>Hasil Hari Ini</h2>
        <p id="final-score"></p>
        <button class="btn" onclick="location.reload()">Main Lagi</button>
    </div>
</div>

<script>
    let score = 0;
    let quality = 1; // 1 = Pahit, 3 = Perfect
    let temp = 0;
    let tempDirection = 1;
    let tempInterval;
    let gameActive = false;

    // Navigasi Screen
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- COOKING LOGIC ---
    function startCooking() {
        showScreen('screen-cooking');
        tempInterval = setInterval(() => {
            temp += 2 * tempDirection;
            if (temp >= 100 || temp <= 0) tempDirection *= -1;
            document.getElementById('indicator').style.left = temp + '%';
        }, 30);
    }

    function stopCooking() {
        clearInterval(tempInterval);
        // Area hijau ada di 70% - 85%
        if (temp >= 70 && temp <= 85) {
            quality = 3;
            alert("Perfect! Suhu pas 80°C. Matcha akan terasa Umami!");
        } else {
            quality = 1;
            alert("Aduh! Suhu gak pas. Matchanya bakal pahit/hambar.");
        }
        startServing();
    }

    // --- SERVING LOGIC (Diner Dash Style) ---
    let customers = [];
    function startServing() {
        showScreen('screen-serving');
        document.getElementById('quality-val').innerText = (quality === 3 ? "⭐⭐⭐" : "⭐");
        gameActive = true;
        spawnCustomer();
        
        // Loop jalannya game
        const gameLoop = setInterval(() => {
            if (!gameActive) {
                clearInterval(gameLoop);
                return;
            }
            
            // Kurangi kesabaran
            customers.forEach((c, index) => {
                c.patience -= 5;
                if (c.patience <= 0) {
                    customers.splice(index, 1); // Customer pergi
                }
            });
            
            // Random muncul customer baru
            if (Math.random() > 0.7 && customers.length < 4) {
                spawnCustomer();
            }
            
            renderCustomers();
        }, 1000);
    }

    function spawnCustomer() {
        customers.push({
            id: Date.now(),
            patience: 100
        });
    }

    function renderCustomers() {
        const area = document.getElementById('customer-area');
        area.innerHTML = '';
        customers.forEach(c => {
            const div = document.createElement('div');
            div.className = 'customer';
            div.innerHTML = `
                <p>👤 Pelanggan</p>
                <div class="patience-bar" style="width:${c.patience}%"></div>
                <button class="btn" style="padding:5px" onclick="serve(${c.id})">SERVE</button>
            `;
            area.appendChild(div);
        });
    }

    function serve(id) {
        customers = customers.filter(c => c.id !== id);
        let points = (quality === 3) ? 20 : 5;
        score += points;
        document.getElementById('score-val').innerText = score;
    }

    function endGame() {
        gameActive = false;
        showScreen('screen-result');
        document.getElementById('final-score').innerText = "Total Skor: " + score;
    }
</script>

</body>
</html>
